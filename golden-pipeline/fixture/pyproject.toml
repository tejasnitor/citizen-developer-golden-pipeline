# A minimal consumer the central test workflow runs every golden-pipeline workflow against.
[project]
name = "fixture-pkg"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest==9.2.0", "pytest-cov==7.1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fixture_pkg"]

[tool.ruff]
line-length = 120
