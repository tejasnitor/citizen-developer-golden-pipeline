---
name: Reusable Secret Scanning

on:
  workflow_call:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Scan Secrets with Gitleaks
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          EXPECTED_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          curl -sSL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${EXPECTED_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/
          gitleaks version

      - name: Run Gitleaks Scan
        run: |
          set +e
          gitleaks git . --redact=100 --report-format sarif --report-path gitleaks.sarif
          gitleaks git . --redact=100 --report-format json --report-path gitleaks.json
          EXIT_CODE=$?
          echo "Gitleaks exit code: $EXIT_CODE"
          if [ "$EXIT_CODE" -eq 0 ]; then
            echo "No secrets detected."
          elif [ "$EXIT_CODE" -eq 1 ]; then
            echo "::error::SECRETS DETECTED IN REPOSITORY. Review findings before merging."
            exit 1
          else
            echo "::error::Gitleaks scan failed with error code $EXIT_CODE"
            exit 1
          fi

      - name: Upload Gitleaks Artifacts
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb99ba811e
        if: always()
        with:
          name: gitleaks-reports
          path: |
            gitleaks.sarif
            gitleaks.json
          retention-days: 30

      - name: Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@b56ba49b26e50535fa1e7f7db0f4f7b4765d08d9
        if: always()
        with:
          sarif_file: gitleaks.sarif
