---
name: PR Checks

on:
  workflow_call:
    inputs:
      release_app:
        type: string
        default: "pp-release-bot[bot]"
      commits_grandfathered:
        type: string
        default: ""

permissions:
  contents: read

jobs:
  pr-title:
    name: Check PR Title
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Checkout Golden Pipeline Tools
        if: hashFiles('golden-pipeline/tools/requirements-ci.txt') == ''
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: tejasnitor/citizen-developer-golden-pipeline
          ref: Golden-Pipeline
          path: .golden-pipeline-tools

      - name: Relocate Tools to Runner Temp
        if: hashFiles('golden-pipeline/tools/requirements-ci.txt') == ''
        run: |
          mkdir -p "$RUNNER_TEMP"
          rm -rf "$RUNNER_TEMP/.golden-pipeline-tools"
          mv .golden-pipeline-tools "$RUNNER_TEMP/.golden-pipeline-tools"

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.11"

      - name: Check PR Title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          TOOLS="golden-pipeline/tools"
          if [ -d "$RUNNER_TEMP/.golden-pipeline-tools/golden-pipeline/tools" ]; then
            TOOLS="$RUNNER_TEMP/.golden-pipeline-tools/golden-pipeline/tools"
          elif [ -d ".golden-pipeline-tools/golden-pipeline/tools" ]; then
            TOOLS=".golden-pipeline-tools/golden-pipeline/tools"
          fi
          python3 "$TOOLS/check_pr_title.py"

  commits:
    name: Check Commit Messages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Checkout Golden Pipeline Tools
        if: hashFiles('golden-pipeline/tools/requirements-ci.txt') == ''
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: tejasnitor/citizen-developer-golden-pipeline
          ref: Golden-Pipeline
          path: .golden-pipeline-tools

      - name: Relocate Tools to Runner Temp
        if: hashFiles('golden-pipeline/tools/requirements-ci.txt') == ''
        run: |
          mkdir -p "$RUNNER_TEMP"
          rm -rf "$RUNNER_TEMP/.golden-pipeline-tools"
          mv .golden-pipeline-tools "$RUNNER_TEMP/.golden-pipeline-tools"

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.11"

      - name: Check Commits
        env:
          COMMITS_GRANDFATHERED: ${{ inputs.commits_grandfathered }}
        run: |
          TOOLS="golden-pipeline/tools"
          if [ -d "$RUNNER_TEMP/.golden-pipeline-tools/golden-pipeline/tools" ]; then
            TOOLS="$RUNNER_TEMP/.golden-pipeline-tools/golden-pipeline/tools"
          elif [ -d ".golden-pipeline-tools/golden-pipeline/tools" ]; then
            TOOLS=".golden-pipeline-tools/golden-pipeline/tools"
          fi
          python3 "$TOOLS/check_commits.py" origin/${{ github.base_ref }} HEAD

  branch-target:
    name: Check Target Branch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Checkout Golden Pipeline Tools
        if: hashFiles('golden-pipeline/tools/requirements-ci.txt') == ''
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: tejasnitor/citizen-developer-golden-pipeline
          ref: Golden-Pipeline
          path: .golden-pipeline-tools

      - name: Relocate Tools to Runner Temp
        if: hashFiles('golden-pipeline/tools/requirements-ci.txt') == ''
        run: |
          mkdir -p "$RUNNER_TEMP"
          rm -rf "$RUNNER_TEMP/.golden-pipeline-tools"
          mv .golden-pipeline-tools "$RUNNER_TEMP/.golden-pipeline-tools"

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.11"

      - name: Check Branch Target
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          RELEASE_APP: ${{ inputs.release_app }}
          BASE_REPO: ${{ github.repository }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          TOOLS="golden-pipeline/tools"
          if [ -d "$RUNNER_TEMP/.golden-pipeline-tools/golden-pipeline/tools" ]; then
            TOOLS="$RUNNER_TEMP/.golden-pipeline-tools/golden-pipeline/tools"
          elif [ -d ".golden-pipeline-tools/golden-pipeline/tools" ]; then
            TOOLS=".golden-pipeline-tools/golden-pipeline/tools"
          fi
          python3 "$TOOLS/check_branch_target.py"
