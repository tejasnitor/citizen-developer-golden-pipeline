---
name: Python CI

on:
  workflow_call:
    inputs:
      python_version:
        type: string
        default: "3.12"
      source_paths:
        type: string
        default: "src"
      test_paths:
        type: string
        default: "tests"
      coverage_min:
        type: string
        default: "80"
      format_baseline:
        type: string
        default: ".github/golden-pipeline/format-baseline.txt"
      types_baseline:
        type: string
        default: ".github/golden-pipeline/types-baseline.txt"
      working_directory:
        type: string
        default: "."

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Set up uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install Pinned CI Tools
        run: |
          uv venv --python "${{ inputs.python_version }}" .ci-venv
          . .ci-venv/bin/activate
          uv pip install -q --require-hashes -r golden-pipeline/tools/requirements-ci.txt

      - name: Run Ruff & Format Check
        working-directory: ${{ inputs.working_directory }}
        run: |
          . $GITHUB_WORKSPACE/.ci-venv/bin/activate
          TOOLS="$GITHUB_WORKSPACE/golden-pipeline/tools"
          ruff check .
          python3 "$TOOLS/check_format.py" --baseline "${{ inputs.format_baseline }}"

  types:
    name: Type Checking (pyright)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Set up uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Sync Project Dependencies
        working-directory: ${{ inputs.working_directory }}
        run: uv sync --frozen --python "${{ inputs.python_version }}"

      - name: Install Pinned CI Tools
        run: |
          uv venv --python "${{ inputs.python_version }}" .ci-venv
          . .ci-venv/bin/activate
          uv pip install -q --require-hashes -r golden-pipeline/tools/requirements-ci.txt

      - name: Run Pyright Check
        working-directory: ${{ inputs.working_directory }}
        run: |
          . $GITHUB_WORKSPACE/.ci-venv/bin/activate
          TOOLS="$GITHUB_WORKSPACE/golden-pipeline/tools"
          python3 "$TOOLS/check_types.py" --baseline "${{ inputs.types_baseline }}" --python-version "${{ inputs.python_version }}" ${{ inputs.source_paths }} ${{ inputs.test_paths }}

  tests:
    name: Tests & Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Sync Project Dependencies
        working-directory: ${{ inputs.working_directory }}
        run: uv sync --frozen --python "${{ inputs.python_version }}"

      - name: Run Pytest with Coverage Floor
        working-directory: ${{ inputs.working_directory }}
        run: |
          cov=()
          for s in ${{ inputs.source_paths }}; do cov+=("--cov=$s"); done
          uv run --frozen --no-sync pytest -q ${{ inputs.test_paths }} "${cov[@]}" --cov-report=term-missing --cov-report=xml:coverage.xml --cov-fail-under=${{ inputs.coverage_min }}
