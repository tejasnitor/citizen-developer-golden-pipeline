---
name: Repository Checks

on:
  workflow_call:
    inputs:
      confidential_denylist:
        type: string
        default: ".github/golden-pipeline/confidential-denylist.txt"
      justfile:
        type: string
        default: "report"
      working_directory:
        type: string
        default: "."

permissions:
  contents: read

jobs:
  pinning:
    name: Check Actions and Hooks Pinning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.11"
      - name: Check Pinning
        run: python3 golden-pipeline/tools/check_repo.py

  codeowners:
    name: Check CODEOWNERS Validity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.11"
      - name: Validate CODEOWNERS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/codeowners/errors?ref=${{ github.ref }}" | python3 golden-pipeline/tools/check_codeowners.py

  confidential:
    name: Check Confidential Content
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.11"
      - name: Scan Confidential Content
        run: |
          python3 golden-pipeline/tools/check_confidential.py \
            --denylist "${{ inputs.confidential_denylist }}" \
            ${{ github.event_name == 'pull_request' && format('--range origin/{0}..HEAD', github.base_ref) || '' }}

  justfile:
    name: Check Justfile
    runs-on: ubuntu-latest
    if: inputs.justfile != 'off'
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.11"
      - name: Validate Justfile
        working-directory: ${{ inputs.working_directory }}
        env:
          MODE: "${{ inputs.justfile }}"
        run: |
          python3 "$GITHUB_WORKSPACE/golden-pipeline/tools/check_justfile.py" --mode "$MODE"
