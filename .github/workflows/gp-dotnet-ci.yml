---
name: .NET 8 CI

on:
  workflow_call:
    inputs:
      dotnet_version:
        description: ".NET SDK Version"
        type: string
        default: "8.0.x"
      solution_path:
        description: "Path to .sln or .csproj"
        type: string
        default: "."
      coverage_threshold:
        description: "Minimum code coverage percentage"
        type: string
        default: "80"
      working_directory:
        description: "Working directory"
        type: string
        default: "."
    secrets:
      SONAR_TOKEN:
        description: "SonarQube Cloud Token"
        required: false

permissions:
  contents: read

jobs:
  build-and-test:
    name: .NET Build, Test & Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@3951f0dfe7a07e2313ec93c75700083e2005ddab # v4.3.0
        with:
          dotnet-version: ${{ inputs.dotnet_version }}

      - name: Cache NuGet Packages
        uses: actions/cache@0c9c47cb029a91741a4a8123b0b0f9ed66b64d32 # v4.1.2
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore Dependencies
        working-directory: ${{ inputs.working_directory }}
        run: dotnet restore ${{ inputs.solution_path }}

      - name: Build Application
        working-directory: ${{ inputs.working_directory }}
        run: dotnet build ${{ inputs.solution_path }} --configuration Release --no-restore

      - name: Run Tests with Coverage
        working-directory: ${{ inputs.working_directory }}
        run: |
          dotnet test ${{ inputs.solution_path }} \
            --configuration Release \
            --no-build \
            --verbosity normal \
            --collect:"XPlat Code Coverage" \
            --results-directory ./TestResults

      - name: Check Package Vulnerabilities
        working-directory: ${{ inputs.working_directory }}
        run: |
          dotnet list ${{ inputs.solution_path }} package --vulnerable --include-transitive
